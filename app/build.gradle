import groovy.xml.MarkupBuilder

plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

def twaManifest = [
    applicationId: 'com.evolucaoclinica.app',
    hostName: 'www.evolucaoclinica.app.br',
    launchUrl: '/login',
    name: 'Evolução Clínica',
    launcherName: 'Evolução Clínica',
    themeColor: '#005C13',
    themeColorDark: '#000000',
    navigationColor: '#000000',
    navigationColorDark: '#000000',
    navigationDividerColor: '#000000',
    navigationDividerColorDark: '#000000',
    backgroundColor: '#FFFFFF',
    enableNotifications: true,
    shortcuts: [],
    splashScreenFadeOutDuration: 300,
    generatorApp: 'bubblewrap-cli',
    fallbackType: 'customtabs',
    enableSiteSettingsShortcut: 'true',
    orientation: 'portrait',
]

// Credenciais de assinatura nunca ficam no repositório. Para gerar qualquer
// release, informe ANDROID_KEYSTORE_PASSWORD (e, se necessário,
// ANDROID_KEY_PASSWORD / ANDROID_KEY_ALIAS) no ambiente de build.
def releaseKeystore = rootProject.file(System.getenv('ANDROID_KEYSTORE_PATH') ?: 'android.keystore')
def releaseStorePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD')
def releaseKeyPassword = System.getenv('ANDROID_KEY_PASSWORD') ?: releaseStorePassword
def releaseKeyAlias = System.getenv('ANDROID_KEY_ALIAS') ?: 'android'
def isReleaseTask = gradle.startParameter.taskNames.any {
    def taskName = it.toLowerCase()
    taskName.contains('release') || taskName in ['assemble', 'bundle', 'build']
}

if (isReleaseTask && !releaseKeystore.exists()) {
    throw new GradleException('Chave de assinatura Android não encontrada. Configure ANDROID_KEYSTORE_PATH ou mantenha android.keystore na raiz do projeto.')
}
if (isReleaseTask && (!releaseStorePassword || !releaseKeyPassword)) {
    throw new GradleException('Credenciais de assinatura ausentes. Defina ANDROID_KEYSTORE_PASSWORD e ANDROID_KEY_PASSWORD antes de gerar uma release.')
}

android {
    compileSdk 36
    namespace "com.evolucaoclinica.app"

    defaultConfig {
        applicationId "com.evolucaoclinica.app"
        minSdk 23
        targetSdk 36
        versionCode 91
        versionName "91"

        resValue "string", "appName", twaManifest.name
        resValue "string", "launcherName", twaManifest.launcherName

        def launchUrl = "https://" + twaManifest.hostName + twaManifest.launchUrl
        resValue "string", "launchUrl", launchUrl
        resValue "string", "webManifestUrl", 'https://www.evolucaoclinica.app.br/manifest.webmanifest'
        resValue "string", "fullScopeUrl", 'https://www.evolucaoclinica.app.br/'
        resValue "string", "shareTarget", '{\\"action\\":\\"https://www.evolucaoclinica.app.br/api/share-target\\",\\"method\\":\\"POST\\",\\"enctype\\":\\"multipart/form-data\\",\\"params\\":{\\"title\\":\\"title\\",\\"text\\":\\"text\\",\\"url\\":\\"url\\",\\"files\\":[{\\"name\\":\\"audio\\",\\"accept\\":[\\"audio/*\\",\\"video/*\\",\\"application/ogg\\",\\"*/*\\"]}]}}'
        resValue "string", "hostName", twaManifest.hostName
        resValue "color", "colorPrimary", twaManifest.themeColor
        resValue "color", "colorPrimaryDark", twaManifest.themeColorDark
        resValue "color", "navigationColor", twaManifest.navigationColor
        resValue "color", "navigationColorDark", twaManifest.navigationColorDark
        resValue "color", "navigationDividerColor", twaManifest.navigationDividerColor
        resValue "color", "navigationDividerColorDark", twaManifest.navigationDividerColorDark
        resValue "color", "backgroundColor", twaManifest.backgroundColor
        resValue "string", "providerAuthority", twaManifest.applicationId + '.fileprovider'
        resValue "bool", "enableNotification", twaManifest.enableNotifications.toString()

        twaManifest.shortcuts.eachWithIndex { shortcut, index ->
            resValue "string", "shortcut_name_$index", "$shortcut.name"
            resValue "string", "shortcut_short_name_$index", "$shortcut.short_name"
        }

        resValue "integer", "splashScreenFadeOutDuration", twaManifest.splashScreenFadeOutDuration.toString()
        resValue "string", "generatorApp", twaManifest.generatorApp
        resValue "string", "fallbackType", twaManifest.fallbackType
        resValue "bool", "enableSiteSettingsShortcut", twaManifest.enableSiteSettingsShortcut
        resValue "string", "orientation", twaManifest.orientation
    }

    signingConfigs {
        release {
            storeFile releaseKeystore
            storePassword releaseStorePassword
            keyAlias releaseKeyAlias
            keyPassword releaseKeyPassword
        }
    }

    buildTypes {
        release {
            // R8 completo: shrinking de código, otimização e ofuscação.
            minifyEnabled true
            // Remove recursos que se tornam inalcançáveis após o shrinking do código.
            shrinkResources true
            // Usa a configuração otimizada recomendada pelo Android para releases.
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lintOptions {
        checkReleaseBuilds false
    }
}

task generateShorcutsFile {
    assert twaManifest.shortcuts.size() < 5, "You can have at most 4 shortcuts."
    twaManifest.shortcuts.eachWithIndex { s, i ->
        assert s.name != null, 'Missing `name` in shortcut #' + i
        assert s.short_name != null, 'Missing `short_name` in shortcut #' + i
        assert s.url != null, 'Missing `icon` in shortcut #' + i
        assert s.icon != null, 'Missing `url` in shortcut #' + i
    }

    def shortcutsFile = new File("$projectDir/src/main/res/xml", "shortcuts.xml")

    def shortcutsXml = new StringWriter()
    def xmlMarkup = new MarkupBuilder(new IndentPrinter(shortcutsXml, "    ", true))

    xmlMarkup
        .'shortcuts'('xmlns:android': 'http://schemas.android.com/apk/res/android') {
            twaManifest.shortcuts.eachWithIndex { s, i ->
                'shortcut'(
                        'android:shortcutId': 'shortcut' + i,
                        'android:enabled': true,
                        'android:icon': '@drawable/' + s.icon,
                        'android:shortcutShortLabel': '@string/shortcut_short_name_' + i,
                        'android:shortcutLongLabel': '@string/shortcut_name_' + i) {
                    'intent'(
                            'android:action': 'android.intent.action.MAIN',
                            'android:targetPackage': twaManifest.applicationId,
                            'android:targetClass': twaManifest.applicationId + '.LauncherActivity',
                            'android:data': s.url)
                    'categories'('android:name': 'android.intent.category.LAUNCHER')
                }
            }
        }
    shortcutsFile.text = shortcutsXml.toString() + '\n'
}

preBuild.dependsOn(generateShorcutsFile)

repositories {
}

dependencies {
    implementation 'com.android.installreferrer:installreferrer:2.2'
    implementation 'com.google.android.play:app-update:2.1.0'
    implementation 'com.google.firebase:firebase-analytics:23.2.0'
    implementation 'com.google.firebase:firebase-messaging:24.1.0'
    implementation 'com.stripe:stripe-android:23.0.1'
    implementation 'com.android.billingclient:billing:9.1.0'
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.webkit:webkit:1.14.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.6.2'
}

name: Patch campaign dispatch for round 5

on:
  push:
    paths:
      - '.github/workflows/patch-round5-dispatch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch AdminCampaignDispatch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/pages/AdminCampaignDispatch.tsx')
          text = path.read_text(encoding='utf-8')

          required = [
              'Round4ReadinessResult',
              'round4Readiness',
              'round=4',
              'Rodada 4',
          ]
          for token in required:
              if token not in text:
                  raise SystemExit(f'missing expected token: {token}')

          text = text.replace('Round4ReadinessResult', 'Round5ReadinessResult')
          text = text.replace('round4', 'round5')
          text = text.replace('Rodada 4', 'Rodada 5')
          text = text.replace('R4', 'R5')

          checks = [
              'Round5ReadinessResult',
              'round5Readiness',
              'round=5',
              'Pré-checagem da Rodada 5',
              'round5_data_incomplete',
              'loadRound5Readiness',
          ]
          for token in checks:
              if token not in text:
                  raise SystemExit(f'round 5 assertion failed: {token}')

          path.write_text(text, encoding='utf-8')
          PY
      - name: Validate
        run: |
          npm ci
          npm run lint
          npm run build
      - name: Commit functional change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/AdminCampaignDispatch.tsx
          git diff --cached --quiet && exit 0
          git commit -m "feat: prepare campaign dispatch for round 5"
          git push

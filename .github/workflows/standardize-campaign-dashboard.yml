name: Standardize campaign dashboard

on:
  push:
    paths:
      - '.github/workflows/standardize-campaign-dashboard.yml'
      - '.github/scripts/standardize_campaign_dashboard.py'

permissions:
  contents: write

jobs:
  standardize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply standardization
        run: python .github/scripts/standardize_campaign_dashboard.py
      - name: Validate
        run: |
          npm ci
          npm run lint
          npm run build
      - name: Commit functional changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/AdminCampaignDashboard.tsx api/campaign-dashboard.ts src/components/layout/AppVersion.tsx AGENTS.md archicteture/CAPTACAO_DASHBOARD_PADRAO.md
          git diff --cached --quiet && exit 0
          git commit -m "feat: standardize campaign round dashboards"
          git push

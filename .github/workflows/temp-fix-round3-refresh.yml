name: Temporary Round 3 Refresh Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-fix-round3-refresh.yml'
      - 'src/pages/AdminCampaignDispatch.tsx'
      - 'api/campaign-dashboard.ts'

permissions:
  contents: write

jobs:
  patch-validate-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch refresh behavior
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          frontend_path = Path('src/pages/AdminCampaignDispatch.tsx')
          frontend = frontend_path.read_text(encoding='utf-8')

          old_fetch = """      const response = await fetch('/api/admin/campaign-dashboard?round=3', {
        method: 'GET',
        headers: {
          Authorization: `Bearer ${accessToken}`,
          Accept: 'application/json'
        },
        cache: 'no-store'
      });"""

          new_fetch = """      const refreshNonce = `${Date.now()}-${Math.random().toString(36).slice(2)}`;
      const response = await fetch(
        `/api/admin/campaign-dashboard?round=3&refresh=${encodeURIComponent(refreshNonce)}`,
        {
          method: 'GET',
          headers: {
            Authorization: `Bearer ${accessToken}`,
            Accept: 'application/json',
            'Cache-Control': 'no-cache, no-store, must-revalidate',
            Pragma: 'no-cache'
          },
          cache: 'no-store'
        }
      );"""

          if old_fetch in frontend:
              frontend = frontend.replace(old_fetch, new_fetch, 1)
          elif 'refreshNonce' not in frontend:
              raise SystemExit('Bloco de fetch do pre-check não encontrado.')

          old_state = """      setRound3Readiness(body);
      setRound3ReadinessError('');"""
          new_state = """      setRound3Readiness({
        ...body,
        overall: body.overall ? { ...body.overall } : undefined
      });
      setRound3ReadinessError('');"""

          if old_state in frontend:
              frontend = frontend.replace(old_state, new_state, 1)
          elif 'overall: body.overall ? { ...body.overall } : undefined' not in frontend:
              raise SystemExit('Atualização de estado do pre-check não encontrada.')

          frontend_path.write_text(frontend, encoding='utf-8')

          api_path = Path('api/campaign-dashboard.ts')
          api = api_path.read_text(encoding='utf-8')
          old_headers = """  res.setHeader('Cache-Control', 'no-store');"""
          new_headers = """  res.setHeader('Cache-Control', 'private, no-store, no-cache, must-revalidate, max-age=0');
  res.setHeader('Pragma', 'no-cache');
  res.setHeader('Expires', '0');
  res.setHeader('Vary', 'Authorization');"""

          if old_headers in api:
              api = api.replace(old_headers, new_headers, 1)
          elif "private, no-store, no-cache, must-revalidate, max-age=0" not in api:
              raise SystemExit('Header Cache-Control da API não encontrado.')

          api_path.write_text(api, encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Commit validated fix
        shell: bash
        run: |
          if git diff --quiet -- src/pages/AdminCampaignDispatch.tsx api/campaign-dashboard.ts; then
            echo 'No functional changes to commit.'
            exit 0
          fi
          git config user.name 'Studio4x Automation'
          git config user.email '98415841+studio4x@users.noreply.github.com'
          git add src/pages/AdminCampaignDispatch.tsx api/campaign-dashboard.ts
          git commit -m 'fix: force fresh round 3 readiness refresh'
          git push origin main

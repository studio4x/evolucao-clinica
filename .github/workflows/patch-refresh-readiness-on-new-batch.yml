name: Patch readiness refresh on new batch

on:
  push:
    paths:
      - '.github/workflows/patch-refresh-readiness-on-new-batch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch AdminCampaignDispatch
        run: |
          python -c "from pathlib import Path; p=Path('src/pages/AdminCampaignDispatch.tsx'); t=p.read_text(encoding='utf-8'); old='    setRunRecovered(false);\\n  };'; new='    setRunRecovered(false);\\n    void loadRound4Readiness();\\n  };'; assert old in t, 'resetRun target not found'; u=t.replace(old,new,1); assert u.count('void loadRound4Readiness();') >= 2, 'refresh assertion failed'; p.write_text(u,encoding='utf-8')"
      - name: Validate
        run: |
          npm ci
          npm run lint
          npm run build
      - name: Commit functional change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/AdminCampaignDispatch.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix: refresh round readiness when preparing new batch"
          git push

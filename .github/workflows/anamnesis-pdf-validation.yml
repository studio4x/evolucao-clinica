name: Validate anamnesis PDF and copy flow

on:
  push:
    branches:
      - "validation/anamnesis-20260918"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:anamnesis
      - run: npm run test:pdf-download
      - run: npm run build

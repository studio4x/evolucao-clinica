name: Patch standardize campaign dashboard

on:
  push:
    paths:
      - '.github/workflows/patch-standardize-campaign-dashboard.yml'
      - '.github/scripts/patch_standardize_campaign_dashboard.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply dashboard patch
        run: python .github/scripts/patch_standardize_campaign_dashboard.py
      - name: Bump app build
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/layout/AppVersion.tsx')
          text = p.read_text(encoding='utf-8')
          old = 'export const APP_VERSION = "v1.10.844";'
          new = 'export const APP_VERSION = "v1.10.845";'
          if old not in text:
              raise SystemExit('APP_VERSION anchor not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Validate
        run: |
          npm ci
          npm run lint
          npm run build
      - name: Commit functional change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/AdminCampaignDashboard.tsx src/components/layout/AppVersion.tsx
          git diff --cached --quiet && exit 0
          git commit -m "feat: standardize campaign round dashboards"
          git push
